name: Release SBOMs

# Generates SPDX 2.3 SBOMs for the components shipped from this repository and
# attaches them to the GitHub release. The release tag points at the commit
# consumers build from, and Cargo.lock is committed, so the SBOMs describe the
# exact dependency set of that commit.
#
# Note: cargo-sbom resolves dependencies for all features, so each SBOM is a
# superset of what a particular TEE_PLATFORM / feature selection links in.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to generate and attach SBOMs for
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  sbom:
    name: Generate and publish SBOMs
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to upload SBOMs via gh release upload
      id-token: write # required for OIDC-based attestation signing
      attestations: write # required to create build attestations
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CARGO_SBOM_VERSION: "0.10.0"
      # Cargo packages that produce release artifacts.
      PACKAGES: attestation-agent confidential-data-hub api-server-rest coco_keyprovider
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust-ci

      - name: Install cargo-sbom
        run: cargo install --locked cargo-sbom --version "$CARGO_SBOM_VERSION"

      - name: Generate SPDX SBOMs
        run: |
          mkdir sbom
          for pkg in $PACKAGES; do
            cargo sbom --cargo-package "$pkg" --output-format spdx_json_2_3 \
              > "sbom/${pkg}-${TAG}.spdx.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["packages"], "empty SBOM"' \
              "sbom/${pkg}-${TAG}.spdx.json"
          done
          ls -l sbom

      - name: Attest SBOMs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sbom/*.spdx.json

      - name: Upload SBOMs to the release
        run: gh release upload "$TAG" sbom/*.spdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
